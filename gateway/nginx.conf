worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 65535;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 10000;
  server_tokens off;
  access_log /dev/stdout combined buffer=64k flush=2s;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml;

  geo $loadtest_ip { default 0; include /etc/nginx/loadtest-allow.conf; }
  map $loadtest_ip $limit_key { 0 $binary_remote_addr; 1 ""; }

  map $http_user_agent $suspect_agent {
    default 0;
    ""      1;
    ~*(python-|curl/|wget/|scrapy|go-http-client|java/|libwww|okhttp/[0-2]) 1;
  }
  map "$loadtest_ip$suspect_agent" $block_bot { default 0; "01" 1; }

  limit_req_zone  $limit_key zone=checkout:20m rate=20r/s;
  limit_req_zone  $limit_key zone=session:10m  rate=5r/s;
  limit_req_zone  $limit_key zone=reads:20m    rate=50r/s;
  limit_conn_zone $limit_key zone=perip:20m;
  limit_req_status  429;
  limit_conn_status 429;

  proxy_cache_path /var/cache/nginx/sale levels=1 keys_zone=sale:1m max_size=10m inactive=10s use_temp_path=off;

  upstream api {
    least_conn;
    server api1:3000 max_fails=0;
    server api2:3000 max_fails=0;
    server api3:3000 max_fails=0;
    keepalive 512;
  }

  server {
    listen 80 default_server reuseport backlog=65535;
    root /usr/share/nginx/html;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }

    location = /api/time {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 200 '{"t":$msec}';
    }

    location = /api/sale {
      limit_req zone=reads burst=100 nodelay;
      proxy_cache sale;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout http_502 http_503;
      proxy_ignore_headers Cache-Control Set-Cookie;
      add_header X-Cache $upstream_cache_status;
      include /etc/nginx/proxy_common.conf;
      proxy_pass http://api;
    }

    location = /api/checkout {
      if ($block_bot) { return 403 '{"code":"CLIENT_BLOCKED"}'; }
      limit_req zone=checkout burst=40 nodelay;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_next_upstream error timeout non_idempotent;
      proxy_next_upstream_tries 2;
      include /etc/nginx/proxy_common.conf;
      proxy_pass http://api;
    }

    location = /api/session {
      if ($block_bot) { return 403 '{"code":"CLIENT_BLOCKED"}'; }
      limit_req zone=session burst=20 nodelay;
      include /etc/nginx/proxy_common.conf;
      proxy_pass http://api;
    }

    location ~ ^/api/orders/[0-9a-f-]+/events$ {
      limit_conn perip 20;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      include /etc/nginx/proxy_common.conf;
      proxy_pass http://api;
    }

    location /api/ {
      limit_req zone=reads burst=50 nodelay;
      include /etc/nginx/proxy_common.conf;
      proxy_pass http://api;
    }

    location /internal/ { return 404; }

    error_page 429 = @too_many;
    location @too_many {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"code":"RATE_LIMITED"}';
    }
    error_page 502 503 504 = @unavailable;
    location @unavailable {
      default_type application/json;
      add_header Retry-After 2 always;
      return 503 '{"code":"TEMPORARILY_UNAVAILABLE"}';
    }
  }
}
